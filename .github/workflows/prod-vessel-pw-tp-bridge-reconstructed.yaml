on:
    workflow_dispatch:
        # inputs:
        #   ContinueOnError:
        #     type: choice
        #     description: 'Continue on SonarQube scan failures?'
        #     required: true
        #     options:
        #       - false
        #       - true
        #   ContinueOnErrorSnyk:
